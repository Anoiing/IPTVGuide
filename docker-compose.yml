version: '3.8'

services:
  iptvguide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iptvguide
    ports:
      - '5174:5174'
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - PORT=5174
    volumes:
      # 持久化配置和输出目录
      - ./config:/app/config
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:5174/api/getStatus', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - iptvguide-network

  # 可选：添加反向代理
  nginx:
    image: nginx:alpine
    container_name: iptvguide-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - iptvguide
    restart: unless-stopped
    networks:
      - iptvguide-network
    profiles:
      - with-nginx

networks:
  iptvguide-network:
    driver: bridge

volumes:
  config-data:
  output-data:
